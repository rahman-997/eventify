name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: eventify
          POSTGRES_USER: eventify
          POSTGRES_PASSWORD: eventify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eventify -d eventify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://eventify:eventify@localhost:5432/eventify
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-only-eventify-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      WEB_ORIGIN: http://localhost:5173
      AUTH_RATE_LIMIT_MAX: 10000
      EMAIL_MODE: log
      METRICS_ENABLED: "true"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install API dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Seed integration fixtures
        run: npm run db:seed

      - name: Verify API, architecture and tests
        run: npm run verify

      - name: BullMQ worker smoke
        shell: bash
        run: |
          set -euo pipefail
          PORT=3010 npm run worker > /tmp/eventify-worker.log 2>&1 &
          worker_pid=$!
          cleanup() { kill "$worker_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3010/ready > /tmp/worker-ready.json; then
              cat /tmp/worker-ready.json
              curl --fail --silent http://127.0.0.1:3010/health
              curl --fail --silent http://127.0.0.1:3010/metrics | grep eventify_worker_up
              exit 0
            fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then
              cat /tmp/eventify-worker.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/eventify-worker.log
          exit 1

      - name: Install frontend dependencies
        working-directory: web
        run: npm install --no-audit --no-fund

      - name: Verify frontend and bundle budget
        working-directory: web
        run: npm run verify

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Frontend dependency audit
        working-directory: web
        run: npm audit --audit-level=high
