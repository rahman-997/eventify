name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: eventify
          POSTGRES_USER: eventify
          POSTGRES_PASSWORD: eventify
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U eventify -d eventify"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://eventify:eventify@localhost:5432/eventify
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-only-eventify-secret-0123456789-abcdefghijklmnopqrstuvwxyz
      WEB_ORIGIN: http://localhost:5173
      AUTH_RATE_LIMIT_MAX: 10000
      EMAIL_MODE: log
      METRICS_ENABLED: "true"
      SEED_TEST_PASSWORD: eventify-ci-fixture-auth-v1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install API dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Seed integration fixtures
        run: npm run db:seed

      - name: Verify API, architecture and tests
        run: npm run verify

      - name: BullMQ worker smoke
        shell: bash
        run: |
          set -euo pipefail
          PORT=3010 npm run worker > /tmp/eventify-worker.log 2>&1 &
          worker_pid=$!
          cleanup() { kill "$worker_pid" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3010/ready > /tmp/worker-ready.json; then
              cat /tmp/worker-ready.json
              curl --fail --silent http://127.0.0.1:3010/health
              curl --fail --silent http://127.0.0.1:3010/metrics | grep eventify_worker_up
              exit 0
            fi
            if ! kill -0 "$worker_pid" 2>/dev/null; then
              cat /tmp/eventify-worker.log
              exit 1
            fi
            sleep 1
          done
          cat /tmp/eventify-worker.log
          exit 1

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Verify frontend and bundle budget
        working-directory: web
        run: npm run verify

      - name: Dependency audits
        shell: bash
        run: |
          set -euo pipefail

          audit_dir="$(mktemp -d)"
          trap 'rm -rf "$audit_dir"' EXIT

          start_audit() {
            local key="$1"
            local directory="$2"
            shift 2

            (
              set +e
              cd "$directory"
              timeout 120s "$@" > "$audit_dir/$key.out" 2>&1
              printf '%s\n' "$?" > "$audit_dir/$key.status"
            ) &
          }

          check_audit() {
            local key="$1"
            local label="$2"
            local audit_status
            local audit_output

            audit_status="$(cat "$audit_dir/$key.status")"
            audit_output="$(cat "$audit_dir/$key.out")"

            echo "::group::$label"
            printf '%s\n' "$audit_output"
            echo '::endgroup::'

            if [ "$audit_status" -eq 0 ]; then
              return 0
            fi

            if [ "$audit_status" -eq 124 ] || printf '%s\n' "$audit_output" | grep -Eq 'Service Unavailable|audit endpoint returned an error|ECONNRESET|ETIMEDOUT|EAI_AGAIN'; then
              echo "::warning::$label could not reach the npm audit service; CodeQL, Semgrep and Dependabot remain active, so CI will not fail on this external outage."
              return 0
            fi

            return "$audit_status"
          }

          start_audit api-runtime . npm audit --omit=dev --audit-level=high
          start_audit api-critical . npm audit --audit-level=critical
          start_audit web-runtime web npm audit --omit=dev --audit-level=high
          start_audit web-critical web npm audit --audit-level=critical
          wait

          audit_failed=0
          check_audit api-runtime 'API runtime dependency audit' || audit_failed=1
          check_audit api-critical 'API full-tree critical audit' || audit_failed=1
          check_audit web-runtime 'Frontend runtime dependency audit' || audit_failed=1
          check_audit web-critical 'Frontend full-tree critical audit' || audit_failed=1
          exit "$audit_failed"
