name: Refresh npm lockfiles

on:
  push:
    branches: [ci/reproducible-installs]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ci/reproducible-installs
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Generate API lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Generate frontend lockfile
        working-directory: web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfiles when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json web/package-lock.json && git ls-files --error-unmatch package-lock.json web/package-lock.json >/dev/null 2>&1; then
            echo "Lockfiles already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json web/package-lock.json
          git commit -m "chore: lock npm dependency graphs"
          git push origin HEAD:ci/reproducible-installs
